name: Contract tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use minimum supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install optional media and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg poppler-utils weasyprint

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Run contract checks
        run: npm run check
